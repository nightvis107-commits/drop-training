<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Drop Training">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./app-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Entrenamiento Fortnite</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10121a;
      --panel: #191c27;
      --panel-2: #202432;
      --panel-3: #272c3c;
      --line: #303648;
      --text: #f3f5fb;
      --muted: #a1a8bb;
      --green: #b6f34c;
      --green-dark: #26351a;
      --purple: #a78bfa;
      --orange: #ffb86b;
      --red: #ff737a;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 82% -12%, rgba(111, 87, 211, .17), transparent 34rem),
        var(--bg);
      color: var(--text);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button { color: inherit; font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 3px;
    }
    .app { min-height: 100vh; display: grid; grid-template-columns: 244px minmax(0, 1fr); }
    .sidebar {
      padding: 26px 16px;
      border-right: 1px solid rgba(255,255,255,.07);
      background: rgba(16,18,26,.76);
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 9px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      color: #151a10; background: var(--green);
      font-weight: 900; letter-spacing: -.08em;
      box-shadow: 0 6px 24px rgba(182,243,76,.16);
    }
    .brand-name { font-weight: 700; letter-spacing: -.02em; }
    .brand-caption { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .nav-label {
      color: #7e869b; text-transform: uppercase; font-size: 10px;
      font-weight: 700; letter-spacing: .13em; padding: 0 12px; margin: 0 0 8px;
    }
    .nav-list { display: grid; gap: 5px; }
    .nav-button {
      border: 0; background: transparent; border-radius: 11px; min-height: 44px;
      padding: 10px 12px; display: flex; align-items: center; gap: 11px;
      color: var(--muted); text-align: left; cursor: pointer;
      transition: background .16s ease, color .16s ease;
    }
    .nav-button:hover { background: rgba(255,255,255,.055); color: var(--text); }
    .nav-button.active { color: var(--green); background: rgba(182,243,76,.10); }
    .nav-icon { width: 22px; text-align: center; font-size: 16px; }
    .sidebar-note {
      margin-top: auto; padding: 15px; border-radius: 14px;
      background: linear-gradient(140deg, rgba(167,139,250,.13), rgba(167,139,250,.045));
      border: 1px solid rgba(167,139,250,.18);
    }
    .sidebar-note strong { display: block; font-size: 13px; margin-bottom: 5px; }
    .sidebar-note span { color: var(--muted); font-size: 12px; }
    main { min-width: 0; }
    .topbar {
      height: 72px; border-bottom: 1px solid rgba(255,255,255,.065);
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 0 clamp(20px, 4vw, 54px);
    }
    .crumb { color: var(--muted); font-size: 13px; }
    .top-date { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px rgba(182,243,76,.6); }
    .content { max-width: 1190px; margin: 0 auto; padding: 36px clamp(20px, 4vw, 54px) 64px; }
    .eyebrow {
      color: var(--green); text-transform: uppercase; letter-spacing: .14em;
      font-size: 11px; font-weight: 800; margin: 0 0 9px;
    }
    h1 { font-size: clamp(29px, 4vw, 43px); line-height: 1.1; margin: 0; letter-spacing: -.045em; }
    h2 { font-size: 22px; line-height: 1.2; letter-spacing: -.03em; margin: 0; }
    h3 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
    p { margin: 0; }
    .page-intro { color: var(--muted); max-width: 650px; margin-top: 11px; }
    .welcome {
      min-height: 230px; position: relative; overflow: hidden; border-radius: 24px;
      padding: clamp(26px, 4vw, 42px); display: flex; align-items: center;
      background:
        radial-gradient(circle at 83% 52%, rgba(182,243,76,.18), transparent 12rem),
        linear-gradient(112deg, #202634 0%, #1d2230 52%, #26243b 100%);
      border: 1px solid rgba(255,255,255,.075);
    }
    .welcome::after {
      content: "GG"; position: absolute; right: 5%; top: -25px;
      color: rgba(255,255,255,.035); font-size: 190px; line-height: 1;
      letter-spacing: -.12em; font-weight: 900; pointer-events: none;
    }
    .welcome-copy { position: relative; z-index: 1; max-width: 650px; }
    .welcome .page-intro { max-width: 510px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 23px; }
    .button {
      min-height: 43px; padding: 10px 16px; border-radius: 11px;
      border: 1px solid var(--line); background: var(--panel-3); color: var(--text);
      cursor: pointer; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
    }
    .button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .button.primary { color: #151a10; border-color: var(--green); background: var(--green); }
    .button.secondary { background: rgba(255,255,255,.055); }
    .button.small { min-height: 36px; padding: 7px 12px; font-size: 13px; }
    .button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 14px; margin: 22px 0 37px;
    }
    .stat {
      border: 1px solid var(--line); background: rgba(25,28,39,.78);
      border-radius: 15px; padding: 17px 19px;
    }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { font-size: 25px; font-weight: 750; letter-spacing: -.04em; margin-top: 3px; }
    .stat-note { color: #8991a5; font-size: 11px; margin-top: 2px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 15px; }
    .section-heading p { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .link-button { border: 0; background: transparent; color: var(--green); padding: 7px; font-size: 13px; cursor: pointer; }
    .routine-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
    .routine-card {
      border: 1px solid var(--line); background: var(--panel);
      border-radius: 16px; padding: 17px; display: flex; align-items: center; gap: 14px;
      cursor: pointer; text-align: left; transition: border-color .15s ease, transform .15s ease, background .15s ease;
    }
    .routine-card:hover { border-color: rgba(182,243,76,.48); background: #1d2230; transform: translateY(-2px); }
    .routine-icon {
      width: 46px; height: 46px; border-radius: 14px; flex: 0 0 auto;
      display: grid; place-items: center; font-size: 19px; background: rgba(182,243,76,.10);
    }
    .routine-card:nth-child(2) .routine-icon, .routine-icon.purple { background: rgba(167,139,250,.13); }
    .routine-card:nth-child(3) .routine-icon, .routine-icon.orange { background: rgba(255,184,107,.13); }
    .routine-copy { min-width: 0; flex: 1; }
    .routine-copy strong { display: block; }
    .routine-copy span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .routine-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .two-column { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap: 28px; margin-top: 38px; }
    .challenge-preview {
      border-radius: 16px; padding: 19px; background: linear-gradient(145deg, rgba(167,139,250,.12), rgba(167,139,250,.035));
      border: 1px solid rgba(167,139,250,.2); min-height: 176px;
    }
    .challenge-preview .eyebrow { color: var(--purple); margin-bottom: 8px; }
    .challenge-preview p { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .challenge-preview .button { margin-top: 15px; }
    .tip {
      border-radius: 16px; padding: 19px; background: rgba(25,28,39,.74);
      border: 1px solid var(--line); min-height: 176px;
    }
    .tip p { color: var(--muted); font-size: 13px; margin-top: 10px; }
    .routine-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
      margin-bottom: 24px;
    }
    .routine-heading { display: flex; gap: 15px; align-items: flex-start; }
    .routine-heading .routine-icon { width: 54px; height: 54px; font-size: 22px; }
    .routine-heading .page-intro { margin-top: 7px; }
    .duration-pill {
      flex: 0 0 auto; border-radius: 999px; padding: 8px 12px;
      color: var(--green); background: rgba(182,243,76,.09);
      font-size: 12px; font-weight: 700;
    }
    .progress-wrap { margin: 0 0 17px; }
    .progress-copy { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: #292e3c; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--green), #d7ff87); transition: width .25s ease; }
    .exercise-list { display: grid; gap: 10px; }
    .exercise {
      display: grid; grid-template-columns: 24px minmax(0,1fr) auto; align-items: center; gap: 14px;
      padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(25,28,39,.8);
      transition: border-color .15s ease, opacity .15s ease;
    }
    .exercise.completed { border-color: rgba(182,243,76,.25); background: rgba(182,243,76,.045); }
    .exercise-check {
      width: 20px; height: 20px; accent-color: var(--green); cursor: pointer;
    }
    .exercise-title { font-weight: 650; }
    .exercise.completed .exercise-title { color: #bbc4b0; text-decoration: line-through; text-decoration-color: #7e9460; }
    .exercise-detail { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .exercise-time { color: var(--green); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .session-panel {
      margin-top: 22px; border-radius: 17px; padding: 18px;
      background: linear-gradient(120deg, rgba(182,243,76,.09), rgba(182,243,76,.025));
      border: 1px solid rgba(182,243,76,.18);
    }
    .session-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .session-kicker { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
    .session-current { font-weight: 700; margin-top: 3px; }
    .timer { font-variant-numeric: tabular-nums; font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -.04em; color: var(--green); }
    .session-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .session-empty { color: var(--muted); font-size: 13px; }
    .session-empty strong { color: var(--text); display: block; margin-bottom: 4px; }
    .challenge-banner {
      padding: 23px; border-radius: 18px; background: linear-gradient(115deg, rgba(167,139,250,.14), rgba(167,139,250,.045));
      border: 1px solid rgba(167,139,250,.21); margin: 23px 0 28px;
    }
    .challenge-banner.done { background: linear-gradient(115deg, rgba(182,243,76,.12), rgba(182,243,76,.04)); border-color: rgba(182,243,76,.28); }
    .challenge-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .challenge-date { color: var(--purple); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
    .challenge-banner.done .challenge-date { color: var(--green); }
    .challenge-banner h2 { margin-top: 6px; }
    .challenge-banner p { color: var(--muted); margin-top: 8px; max-width: 700px; }
    .challenge-objective { display: flex; align-items: start; gap: 10px; margin: 17px 0; color: var(--text); font-size: 13px; }
    .challenge-objective span:first-child { color: var(--purple); }
    .challenge-banner.done .challenge-objective span:first-child { color: var(--green); }
    .week-heading { margin: 0 0 13px; }
    .week-list { display: grid; gap: 9px; }
    .week-day {
      display: grid; grid-template-columns: 74px minmax(0,1fr) auto; align-items: center; gap: 14px;
      text-align: left; width: 100%; padding: 13px 15px;
      border-radius: 13px; border: 1px solid var(--line); background: rgba(25,28,39,.7);
      cursor: pointer; transition: background .15s ease, border-color .15s ease;
    }
    .week-day:hover { background: #1d2230; }
    .week-day.today { border-color: rgba(167,139,250,.47); }
    .week-day.selected { box-shadow: inset 3px 0 0 var(--purple); }
    .week-day.complete { border-color: rgba(182,243,76,.25); }
    .day-date { color: var(--muted); font-size: 12px; }
    .day-title { font-weight: 650; }
    .day-check { color: var(--green); font-size: 12px; font-weight: 700; }
    .challenge-hint { color: var(--muted); font-size: 12px; margin-top: 16px; }
    .gear-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; margin-top: 25px; }
    .gear-card {
      min-height: 126px; padding: 18px; border-radius: 16px;
      border: 1px solid var(--line); background: var(--panel);
      display: flex; align-items: flex-start; gap: 14px;
    }
    .gear-icon {
      flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px;
      display: grid; place-items: center; background: rgba(182,243,76,.10); font-size: 20px;
    }
    .gear-card:nth-child(2) .gear-icon, .gear-card:nth-child(4) .gear-icon { background: rgba(167,139,250,.13); }
    .gear-type { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
    .gear-name { margin-top: 5px; font-size: 16px; font-weight: 700; }
    .gear-note { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .skin-layout { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 18px; margin-top: 25px; align-items: start; }
    .skin-panel { border: 1px solid var(--line); background: rgba(25,28,39,.82); border-radius: 18px; padding: 20px; }
    .skin-panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .skin-panel-heading p { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .skin-count { flex: 0 0 auto; color: var(--muted); font-size: 11px; padding: 6px 9px; border-radius: 999px; background: var(--panel-3); }
    .skin-wheel-stage { position: relative; display: grid; place-items: center; width: min(100%, 380px); aspect-ratio: 1; margin: 12px auto 14px; }
    .skin-wheel { position: relative; width: min(100%, 340px); aspect-ratio: 1; border: 8px solid #292e3c; border-radius: 50%; box-shadow: 0 0 0 5px rgba(182,243,76,.10), 0 18px 40px rgba(0,0,0,.32); }
    .skin-wheel-disc { position: absolute; inset: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.34); border-radius: 50%; transform: rotate(0deg); transition: transform 5.4s cubic-bezier(.12,.77,.09,1); }
    .skin-wheel-label { position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 23px; height: 22px; border-radius: 7px; color: #10121a; background: rgba(255,255,255,.82); font-size: 10px; font-weight: 900; box-shadow: 0 1px 5px rgba(0,0,0,.2); }
    .skin-pointer { position: absolute; z-index: 3; top: 10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 23px solid var(--green); filter: drop-shadow(0 3px 4px rgba(0,0,0,.48)); }
    .skin-wheel-center { position: absolute; z-index: 2; top: 50%; left: 50%; display: grid; place-items: center; width: 68px; height: 68px; transform: translate(-50%,-50%); border: 5px solid #292e3c; border-radius: 50%; color: #151a10; background: var(--green); font-size: 22px; font-weight: 900; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    .skin-spin { width: 100%; }
    .skin-result { margin-top: 16px; padding: 16px; border: 1px solid rgba(182,243,76,.22); border-radius: 14px; background: linear-gradient(135deg, rgba(182,243,76,.10), rgba(167,139,250,.06)); }
    .skin-result-label { color: var(--green); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
    .skin-result-name { display: block; margin-top: 4px; font-size: 22px; line-height: 1.2; letter-spacing: -.025em; }
    .skin-result-reason { color: var(--muted); margin-top: 7px; font-size: 13px; }
    .skin-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
    .skin-favorite { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 39px; padding: 7px 9px; border: 1px solid rgba(255,255,255,.055); border-radius: 10px; background: rgba(255,255,255,.025); color: var(--muted); font-size: 11px; }
    .skin-favorite.selected { border-color: rgba(182,243,76,.4); color: var(--text); background: rgba(182,243,76,.08); }
    .skin-favorite-number { flex: 0 0 auto; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; color: var(--green); background: rgba(182,243,76,.10); font-size: 10px; font-weight: 800; }
    .skin-favorite-name { overflow-wrap: anywhere; }
    .skin-hint { color: var(--muted); font-size: 12px; margin-top: 13px; }
    .empty-state { color: var(--muted); padding: 24px; border: 1px dashed var(--line); border-radius: 14px; }
    .toast {
      position: fixed; right: 22px; bottom: 22px; z-index: 5; max-width: calc(100vw - 44px);
      padding: 12px 16px; border-radius: 12px; background: var(--green); color: #17200d;
      box-shadow: 0 12px 40px rgba(0,0,0,.3); font-weight: 700; opacity: 0; transform: translateY(10px);
      pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .footer-note { color: #777f92; font-size: 11px; margin-top: 34px; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .skin-layout { grid-template-columns: 1fr; }
      .sidebar {
        position: sticky; top: 0; z-index: 4; padding: 10px 14px;
        border-right: 0; border-bottom: 1px solid rgba(255,255,255,.08);
        background: rgba(16,18,26,.96); gap: 0;
      }
      .brand { display: none; }
      .nav-label, .sidebar-note { display: none; }
      .nav-list { display: flex; overflow-x: auto; gap: 4px; scrollbar-width: none; }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-button { min-height: 42px; padding: 8px 11px; white-space: nowrap; font-size: 12px; }
      .nav-icon { width: auto; }
      .topbar { height: 52px; padding: 0 20px; }
      .content { padding-top: 27px; }
    }
    @media (max-width: 620px) {
      .stats { gap: 8px; margin: 17px 0 30px; }
      .skin-panel { padding: 16px; }
      .skin-wheel-stage { width: min(100%, 340px); }
      .stat { padding: 13px 12px; }
      .stat-value { font-size: 21px; }
      .stat-note { display: none; }
      .routine-grid, .two-column { grid-template-columns: 1fr; }
      .two-column { gap: 12px; margin-top: 30px; }
      .welcome { min-height: 0; padding: 26px 22px; }
      .welcome::after { right: -5%; top: -5px; font-size: 130px; }
      .routine-header { flex-direction: column; }
      .duration-pill { margin-left: 69px; }
      .exercise { grid-template-columns: 24px minmax(0,1fr); gap: 10px; padding: 13px; }
      .exercise-time { grid-column: 2; margin-top: -5px; }
      .session-top { align-items: flex-end; }
      .week-day { grid-template-columns: 55px minmax(0,1fr) auto; gap: 9px; padding: 12px 10px; }
      .day-title { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div><div class="brand-name">Drop Training</div><div class="brand-caption">Tu rutina de Fortnite</div></div>
      </div>
      <div>
        <p class="nav-label">Entrenamiento</p>
        <nav class="nav-list" id="navigation" aria-label="Secciones"></nav>
      </div>
      <div class="sidebar-note">
        <strong>Una sesión a la vez</strong>
        <span>La constancia gana más partidas que entrenar sin un plan.</span>
      </div>
    </aside>
    <main>
      <div class="topbar">
        <div class="crumb" id="breadcrumb">Mi entrenamiento</div>
        <div class="top-date"><span class="live-dot" aria-hidden="true"></span><span id="today-label"></span></div>
      </div>
      <div class="content" id="view" aria-live="polite"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const routines = [
      {
        id: "aim", name: "Aim", icon: "◎", tagline: "Precisión, seguimiento y control del disparo.",
        exercises: [

      view.innerHTML =
        '<div class="routine-header"><div class="routine-heading"><span class="routine-icon" aria-hidden="true">' + routine.icon + '</span><div><p class="eyebrow">Rutina de entrenamiento</p><h1>' + routine.name + '</h1><p class="page-intro">' + routine.tagline + '</p></div></div><div class="duration-pill">◷ &nbsp;' + durationLabel(totalDuration(routine)) + '</div></div>' +
        '<div class="progress-wrap"><div class="progress-copy"><span>Progreso de hoy</span><span>' + done + ' / ' + count + ' ejercicios · ' + percent + '%</span></div><div class="progress-track" role="progressbar" aria-label="Progreso de ' + routine.name + '" aria-valuenow="' + percent + '" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:' + percent + '%"></div></div></div>' +
        '<div class="exercise-list">' + exRows + '</div><section class="session-panel" aria-label="Temporizador de rutina">' + sessionPanel + '</section>' +
        '<p class="footer-note">Los tiempos son sugeridos. Puedes pausar o terminar la sesión cuando quieras.</p>';
      view.querySelectorAll("[data-exercise]").forEach(function (input) {
        input.addEventListener("change", function () {
          dayState(todayKey).exercises[input.dataset.exercise] = input.checked;
          save(); renderRoutine(routine);
        });
      });
      view.querySelectorAll("[data-session]").forEach(function (button) {
        button.addEventListener("click", function () { handleSession(button.dataset.session, routine); });
      });
    }
    function handleSession(action, routine) {
      if (action === "start") {
        const firstIndex = routine.exercises.findIndex(function (ex) { return !dayState(todayKey).exercises[ex[0]]; });
        const index = firstIndex < 0 ? 0 : firstIndex;
        session = { routineId: routine.id, index: index, remaining: routine.exercises[index][3], running: true, endAt: Date.now() + routine.exercises[index][3] * 1000 };
        startTicker();
      } else if (!session) return;
      else if (action === "toggle") {
        if (session.running) { session.remaining = Math.max(0, Math.ceil((session.endAt - Date.now()) / 1000)); session.running = false; }
        else { session.running = true; session.endAt = Date.now() + session.remaining * 1000; startTicker(); }
      } else if (action === "skip") {
        advanceSession(false);
        if (session && session.running) startTicker();
      } else if (action === "stop") {
        session = null; clearInterval(ticker); ticker = null;
      }
      renderRoutine(routine);
    }
    function startTicker() {
      clearInterval(ticker);
      ticker = setInterval(function () {
        if (!session || !session.running) { clearInterval(ticker); ticker = null; return; }
        session.remaining = Math.max(0, Math.ceil((session.endAt - Date.now()) / 1000));
        if (session.remaining <= 0) {
          const routineId = session.routineId;
          advanceSession(true);
          if (!session) {
            clearInterval(ticker); ticker = null;
            if (currentPage === routineId) render();
          } else if (currentPage === routineId) {
            renderRoutine(routines.find(function (r) { return r.id === routineId; }));
          }
          return;
        }
        const timerValue = document.getElementById("timer-value");
        if (timerValue && currentPage === session.routineId) timerValue.textContent = formatTime(session.remaining);
      }, 1000);
    }
    function advanceSession(markDone) {
      if (!session) return;
      const routine = routines.find(function (r) { return r.id === session.routineId; });
      const current = routine.exercises[session.index];
      if (markDone) {
        dayState(todayKey).exercises[current[0]] = true;
        save();
      }
      const nextIndex = session.index + 1;
      if (nextIndex >= routine.exercises.length) {
        session = null; clearInterval(ticker); ticker = null;
        showToast(markDone ? "¡Rutina completada! Buen trabajo." : "Fin de la rutina.");
        return;
      }
      session.index = nextIndex;
      session.remaining = routine.exercises[nextIndex][3];
      if (session.running) session.endAt = Date.now() + session.remaining * 1000;
    }
    function renderChallenges() {
      const start = weekStart(today);
      const selectedDate = new Date(selectedChallengeDate + "T12:00:00");
      const selectedIsToday = selectedChallengeDate === todayKey;
      const selected = challengeFor(selectedDate);
      const selectedDone = dayState(selectedChallengeDate).challengeDone;
      const days = challenges.map(function (challenge, index) {
        const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + index);
        const key = dateKey(date);
        const done = dayState(key).challengeDone;
        const isToday = key === todayKey;
        const isSelected = key === selectedChallengeDate;
        return '<button class="week-day' + (isToday ? ' today' : '') + (done ? ' complete' : '') + (isSelected ? ' selected' : '') + '" type="button" data-challenge-date="' + key + '"' + (isSelected ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' +
          '<span class="day-date">' + challenge.name + '<br>' + new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short" }).format(date) + '</span>' +
          '<span><span class="day-title">' + challenge.title + '</span><span class="exercise-detail">' + challenge.objective + '</span></span>' +
          '<span class="day-check">' + (done ? 'Hecho ✓' : isToday ? 'Hoy' : 'Ver reto') + '</span></button>';
      }).join("");
      view.innerHTML =
        '<p class="eyebrow">Un objetivo diferente cada día</p><h1>Retos diarios</h1><p class="page-intro">Retos cortos para variar la práctica durante la semana. Completa el de hoy o revisa los próximos.</p>' +
        '<section class="challenge-banner' + (selectedDone ? ' done' : '') + '"><div class="challenge-top"><div><div class="challenge-date">' + selected.name + ' · ' + new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "long" }).format(selectedDate) + (selectedIsToday ? ' · Hoy' : '') + '</div><h2>' + selected.title + '</h2><p>' + selected.text + '</p></div><span class="duration-pill">' + (selectedDone ? 'Completado ✓' : selectedIsToday ? 'Reto de hoy' : 'Reto del día') + '</span></div>' +
        '<div class="challenge-objective"><span aria-hidden="true">✦</span><span>' + selected.objective + '</span></div>' +
        '<button class="button ' + (selectedDone ? 'secondary' : 'primary') + '" type="button" data-challenge-toggle>' + (selectedDone ? 'Desmarcar reto' : 'Marcar reto como completado ✓') + '</button></section>' +
        '<div class="section-heading week-heading"><div><h2>Esta semana</h2><p>Cada día tiene su propio reto y progreso.</p></div></div><div class="week-list">' + days + '</div>' +
        '<p class="challenge-hint">El reto de hoy cambia automáticamente cada día. Tus marcas quedan guardadas en este dispositivo.</p>';
      view.querySelector("[data-challenge-toggle]").addEventListener("click", function () {
        dayState(selectedChallengeDate).challengeDone = !dayState(selectedChallengeDate).challengeDone;
        save(); renderChallenges(); showToast(dayState(selectedChallengeDate).challengeDone ? "Reto marcado como completado." : "Marca del reto quitada.");
      });
      view.querySelectorAll("[data-challenge-date]").forEach(function (button) {
        button.addEventListener("click", function () {
          selectedChallengeDate = button.dataset.challengeDate;
          renderChallenges();
        });
      });
    }
    function bindNavigationButtons() {
      view.querySelectorAll("[data-go]").forEach(function (button) {
        button.addEventListener("click", function () { navigate(button.dataset.go); });
      });
    }
    render();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
